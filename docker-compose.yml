services:

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile

    env_file:
      - .env
    profiles: [full]
    ports:
      # Host-side only — moved off the default 8000 because the
      # unrelated easydev-infra "ai-platform" stack (a different
      # project, Backend/multi-tennet-ai-agent) also publishes
      # 8000:8000 for its own ai-workflow-api locally. The app still
      # binds 8000 *inside* this container (HOST/PORT in .env), so
      # nothing internal changes.
      - "8088:8000"

    volumes:
      - .:/app
      - /app/.venv

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - ai-platform

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/.venv
    profiles: [full]

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - ai-platform

  postgres:
    image: pgvector/pgvector:pg17

    env_file:
      - .env
    profiles: [full, data]
    ports:
      # Host-side only — the api/worker containers reach this over the
      # ai-platform network by service name (postgres:5432, unaffected
      # by this remap). Moved off the default 5432 because EasyDev's
      # own core-postgres (easydev-infra/stacks/core) also publishes
      # 5432:5432 for local dev; both are meant to run side by side.
      - "5442:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - ai-platform

  redis:
    image: redis:7-alpine

    ports:
      # Same rationale as postgres above — EasyDev's core-redis also
      # publishes 6379:6379 locally; the api/worker containers still
      # reach this one internally as redis:6379.
      - "6389:6379"

    volumes:
      - redis-data:/data
    profiles: [full, data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

    restart: unless-stopped

    networks:
      - ai-platform

  # OpenTelemetry (docs/mvpRAG.md v1.1) — a local OTLP collector +
  # trace UI so OTEL_ENABLED=true has somewhere real to send spans to.
  # No env_file/healthcheck needed (nothing else depends on it being
  # healthy to start) and no volume — traces are ephemeral, all-in-one
  # is dev/local-only, not meant for production trace retention.
  jaeger:
    image: jaegertracing/all-in-one:latest

    ports:
      - "4317:4317"   # OTLP gRPC receiver — matches OTEL_ENDPOINT's default
      - "16686:16686" # Jaeger UI

    profiles: [full]

    restart: unless-stopped

    networks:
      - ai-platform

volumes:
  postgres-data:
  redis-data:

networks:
  ai-platform:
    driver: bridge