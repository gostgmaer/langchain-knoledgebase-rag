name: CI

# Test jobs (dependency-audit, backend test, frontend-test) were removed on request — not a focus
# right now. Re-add test jobs (and gate build-and-deploy on them via `needs:`) when testing becomes
# a priority again — see git history for the removed jobs' exact content.

on:
  push:
    branches: [main, master]
  # Manual runs always build the backend; frontend builds too unless skip_frontend is checked.
  # There's no "before" commit to diff against here, so this bypasses dorny/paths-filter entirely
  # (see the `changes` job below) instead of trying to feed it a meaningful comparison ref.
  workflow_dispatch:
    inputs:
      skip_frontend:
        description: "Skip building/deploying the frontend image"
        type: boolean
        default: false

jobs:
  # Decides which image(s) this run actually needs.
  # - push: backend-only changes build only the backend image, frontend-only changes build only
  #   the frontend image, a change touching both (or neither path list below) builds both.
  #   Compares against the commit before the push (`github.event.before`), which
  #   dorny/paths-filter already does by default for a `push` event.
  # - workflow_dispatch: always backend, frontend unless `skip_frontend` was checked.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            backend:
              - 'apps/**'
              - 'packages/**'
              - 'alembic/**'
              - 'alembic.ini'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'scripts/**'
              - 'docker/Dockerfile'
              - 'docker/Dockerfile.worker'
            frontend:
              - 'frontend/**'

      - name: Decide
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.skip_frontend }}" = "true" ]; then
              echo "frontend=false" >> "$GITHUB_OUTPUT"
            else
              echo "frontend=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          fi

  # Pushes to GitHub Container Registry (ghcr.io), not Docker Hub — authenticates with the
  # workflow's own built-in GITHUB_TOKEN (needs `permissions: packages: write` below), so no
  # registry secret has to be created or rotated by hand. Images land at
  # ghcr.io/<repository_owner>/ai-platform[-frontend]. GHCR packages default to **private** —
  # either make them public (package settings on github.com, once the first push creates them) or
  # `docker login ghcr.io` on the deploy host with a PAT that has `read:packages`, or
  # `scripts/deploy_blue_green.sh`'s `docker compose pull` will fail with an auth error there.
  #
  # Still requires these repo secrets for the deploy step (none exist yet as of writing this — add
  # them under Settings -> Secrets and variables -> Actions):
  #   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY    - SSH access to the box running docker-compose.prod.yml
  #   DEPLOY_PATH                                 - that box's checkout of this repo (scripts/
  #                                                  deploy_blue_green.sh and docker-compose.prod.yml
  #                                                  are run from there, not copied over by this job)
  # Until those are added, the build/push steps below succeed on their own and the deploy steps
  # fail at the SSH connection.
  build-and-deploy:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    permissions:
      # write, not read: the release-tag step below pushes a tag using actions/checkout's own
      # GITHUB_TOKEN credentials, no separate PAT.
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag from the merge commit's short SHA
        run: echo "VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # Only on an actual merge, not a manual run — a manual re-run can land on a commit that
      # already has its tag (pushed by the merge that originally built it), and re-tagging it
      # isn't what "release tag on merge" asked for.
      - name: Create and push release tag
        if: github.event_name == 'push'
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image for both api and worker (docker/Dockerfile) — see scripts/build_prod_image.sh's
      # own comment on why they intentionally share a tag.
      - name: Build and push backend image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-platform:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/ai-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_WIDGET_API_URL=${{ vars.NEXT_PUBLIC_WIDGET_API_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-platform-frontend:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/ai-platform-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs the same scripts this repo already documents for a manual deploy (docs/DEPLOYMENT.md
      # §6-7) against the already-cloned copy of this repo on the deploy host — just VERSION-pinned
      # to this merge's image instead of a human picking a version by hand. Split into two steps
      # (rather than one script with inline conditionals) so a backend-only push never touches the
      # frontend service and vice versa — exactly mirroring the build steps above.
      - name: Deploy backend
        if: needs.changes.outputs.backend == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin "${{ github.ref_name }}"
            git checkout "${{ github.sha }}"
            VERSION="${{ env.VERSION }}" scripts/deploy_blue_green.sh
            docker image prune -f

      - name: Deploy frontend
        if: needs.changes.outputs.frontend == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin "${{ github.ref_name }}"
            git checkout "${{ github.sha }}"
            VERSION="${{ env.VERSION }}" docker compose -f docker-compose.prod.yml pull frontend
            VERSION="${{ env.VERSION }}" docker compose -f docker-compose.prod.yml up -d frontend
            docker image prune -f
