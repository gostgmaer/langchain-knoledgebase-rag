# Production overrides. VERSION has no default on purpose — Compose's
# `${VAR:?message}` syntax fails the whole `up` loudly if it's unset,
# rather than silently falling back to a floating `latest` tag (the
# previous default here), which makes a "which image is actually
# running" question unanswerable after any redeploy and defeats
# rollback. Deploy with `VERSION=1.4.2 docker compose -f
# docker-compose.prod.yml up -d`.
#
# `deploy.resources` is honored by a plain `docker compose up` too,
# not just Swarm mode — these are starting points based on what each
# service actually does (api/worker both run LangGraph + LLM client
# calls, not CPU-bound work; postgres/redis are the state layer), not
# load-tested figures — tune against real traffic.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # One-shot: runs the real Alembic migrations as the table owner, then
  # creates/updates the restricted `rag_app` role RLS depends on
  # (docs/DEPLOYMENT.md §4, docs/BUGS.md item 1) — both via
  # MIGRATION_DATABASE_URL, since `rag_app` itself can't run schema DDL
  # or create its own role. `api`/`worker` only start once this exits 0,
  # so a production `docker compose up` enforces RLS by default instead
  # of it being a manual step someone has to remember to run first.
  migrate:
    image: easydev/ai-platform:${VERSION:?Set VERSION to a real image tag before deploying — no floating "latest" in production}

    command: ["sh", "-c", "alembic upgrade head && PYTHONPATH=. python scripts/create_app_role.py"]

    restart: "no"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    logging: *default-logging

    networks:
      - backend

  # Zero-downtime deploys (docs/BUGS.md item 9) — Traefik is the only public entrypoint now
  # (`api_blue`/`api_green` below no longer publish a host port at all), discovering backends via
  # the Docker provider and routing only to containers whose Docker HEALTHCHECK reports healthy
  # (built into docker/Dockerfile already, no extra Traefik config needed for that part). Deploy
  # with `scripts/deploy_blue_green.sh`, not a raw `docker compose up -d` — see that script and
  # docs/DEPLOYMENT.md §7 for the real mechanism (start the idle color, wait for it to go healthy
  # so both run briefly side by side, then drain and stop the old one).
  traefik:
    image: traefik:v3.2

    restart: always

    command:
      - --providers.docker=true
      # Opt-in only (`traefik.enable=true`) — without this, Traefik would also try to route to
      # postgres/redis/worker/backup/migrate, none of which speak HTTP.
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:8000

    ports:
      - "8000:8000"

    volumes:
      # Read-only: Traefik only needs to list/inspect containers to discover backends and their
      # health status, never to create/exec/modify them.
      - /var/run/docker.sock:/var/run/docker.sock:ro

    logging: *default-logging

    networks:
      - backend

  # api_blue / api_green: two identical replicas of the same logical Traefik service (same
  # `traefik.http.services.api...` labels on both — Traefik load-balances across every *running*
  # container that advertises it, which is what makes the brief both-running window during a
  # deploy work at all). Only one is normally running at a time; scripts/deploy_blue_green.sh
  # controls which. Neither publishes a host port directly — Traefik is the only public entrypoint.
  api_blue:
    image: easydev/ai-platform:${VERSION:?Set VERSION to a real image tag before deploying — no floating "latest" in production}

    restart: always

    env_file:
      - .env

    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: "PathPrefix(`/`)"
      traefik.http.routers.api.entrypoints: "web"
      traefik.http.services.api.loadbalancer.server.port: "8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m

    logging: *default-logging

    networks:
      - backend

  api_green:
    image: easydev/ai-platform:${VERSION:?Set VERSION to a real image tag before deploying — no floating "latest" in production}

    restart: always

    env_file:
      - .env

    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: "PathPrefix(`/`)"
      traefik.http.routers.api.entrypoints: "web"
      traefik.http.services.api.loadbalancer.server.port: "8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m

    logging: *default-logging

    networks:
      - backend

  worker:
    image: easydev/ai-platform:${VERSION:?Set VERSION to a real image tag before deploying — no floating "latest" in production}

    command: python -m packages.worker.main

    restart: always

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m

    logging: *default-logging

    networks:
      - backend

  postgres:
    image: pgvector/pgvector:pg17

    restart: always

    env_file:
      - .env

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
        reservations:
          cpus: "0.5"
          memory: 1g

    logging: *default-logging

    networks:
      - backend

  # Runs scripts/backup_db_scheduled.sh on a real interval (docs/BUGS.md item 3: the scripts
  # existed and were proven but nothing scheduled them). Same image as `postgres` so the bundled
  # pg_dump always matches the server's major version exactly, connecting directly over the
  # `backend` network rather than via a docker-socket mount (pg_dump is read-only; no reason to
  # hand a backup sidecar that much privilege). Dumps land in the `backups-data` volume — still
  # on the same host as `postgres-data`, so this does not by itself survive that host's disk
  # failing; shipping dumps off-host is a separate, real operational decision for wherever this
  # deploys (docs/DEPLOYMENT.md §5), not something to guess at from this repo alone.
  backup:
    image: pgvector/pgvector:pg17

    restart: always

    entrypoint: ["sh", "/scripts/backup_db_scheduled.sh"]

    env_file:
      - .env

    environment:
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      PGHOST: postgres

    volumes:
      - ./scripts/backup_db_scheduled.sh:/scripts/backup_db_scheduled.sh:ro
      - backups-data:/backups

    depends_on:
      postgres:
        condition: service_healthy

    logging: *default-logging

    networks:
      - backend

  redis:
    image: redis:8-alpine

    restart: always

    command:
      - redis-server
      - --appendonly
      - yes

    volumes:
      - redis-data:/data

    healthcheck:
      # api/worker both declare `redis: condition: service_healthy` above —
      # without this, that dependency condition could never be reported and
      # `docker compose -f docker-compose.prod.yml up` would fail outright.
      test: ["CMD", "redis-cli", "ping"]

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m

    logging: *default-logging

    networks:
      - backend

networks:
  backend:

volumes:
  postgres-data:
  redis-data:
  backups-data: